<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca - Império Guaxinim</title>
<style>
body{background:#0f0f19;color:#fff;font-family:Arial;margin:0;padding:20px}
h1{text-align:center}
.topo{display:flex;justify-content:center;gap:10px;margin:20px 0}
.btn{background:#6c5ce7;color:#fff;border:none;padding:12px 20px;border-radius:8px;cursor:pointer;font-size:16px}
.btn:hover{background:#5a4bd1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px}
.card{background:#1e1e2f;border-radius:12px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:220px;object-fit:cover}
.card div{padding:10px}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);justify-content:center;align-items:center;padding:20px;box-sizing:border-box;z-index:10}
.modal-content{background:#1e1e2f;padding:20px;border-radius:12px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto}
.close{float:right;font-size:24px;cursor:pointer}
input,textarea{width:100%;padding:10px;margin:8px 0;border-radius:6px;border:none;box-sizing:border-box}
textarea{height:100px}
</style>
</head>
<body>
<h1>📚 Biblioteca Online - 100% pelo celular</h1>
<div class="topo">
<button class="btn" onclick="document.getElementById('addModal').style.display='flex'">+ Adicionar Livro</button>
<button class="btn" onclick="carregar()" style="background:#2d2d44">🔄 Atualizar</button>
</div>
<div id="grid" class="grid">Carregando...</div>

<!-- Modal Ler Livro -->
<div id="modal" class="modal" onclick="fechar()">
<div class="modal-content" onclick="event.stopPropagation()">
<span class="close" onclick="fechar()">&times;</span>
<img id="mCapa" style="width:100%;height:300px;object-fit:cover;border-radius:8px">
<h2 id="mTitulo"></h2><p id="mAutor"></p><p id="mDesc"></p><hr>
<p id="mConteudo" style="white-space:pre-wrap;line-height:1.6"></p>
</div>
</div>

<!-- Modal Adicionar Livro -->
<div id="addModal" class="modal">
<div class="modal-content">
<span class="close" onclick="document.getElementById('addModal').style.display='none'">&times;</span>
<h2>+ Novo Livro</h2>
<input id="nTitulo" placeholder="Título (ex: Harry Potter)">
<input id="nAutor" placeholder="Autor (ex: J.K. Rowling)">
<input id="nCapa" placeholder="Link da capa (ex: https://...jpg)">
<input id="nDesc" placeholder="Descrição curta">
<textarea id="nConteudo" placeholder="Conteúdo do livro... pode colar o texto aqui"></textarea>
<button class="btn" onclick="salvar()">Salvar Livro</button>
<p id="msg" style="text-align:center"></p>
</div>
</div>

<script>
const API='https://livro-api-9t7z.onrender.com/livros';
async function carregar(){
  try{
    let r=await fetch(API); let livros=await r.json();
    let g=document.getElementById('grid'); g.innerHTML='';
    livros.forEach(l=>{
      let c=document.createElement('div'); c.className='card';
      c.innerHTML=`<img src="${l.capaUrl}" onerror="this.src='https://via.placeholder.com/160x220?text='+encodeURIComponent(l.titulo)"><div><b>${l.titulo}</b><br><small>${l.autor||''}</small></div>`;
      c.onclick=()=>abrir(l); g.appendChild(c);
    });
  }catch(e){document.getElementById('grid').innerHTML='Erro ao carregar. O Render tá acordando, espera 30s e clica em Atualizar.'}
}
function abrir(l){
  document.getElementById('mCapa').src=l.capaUrl; document.getElementById('mTitulo').innerText=l.titulo;
  document.getElementById('mAutor').innerText=l.autor; document.getElementById('mDesc').innerText=l.descricao;
  document.getElementById('mConteudo').innerText=l.conteudo||''; document.getElementById('modal').style.display='flex';
}
function fechar(){document.getElementById('modal').style.display='none';}
async function salvar(){
  let msg=document.getElementById('msg'); msg.innerText='Salvando...';
  let livro={titulo:nTitulo.value, autor:nAutor.value, capaUrl:nCapa.value, descricao:nDesc.value, conteudo:nConteudo.value};
  if(!livro.titulo){msg.innerText='Precisa do título';return}
  try{
    let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(livro)});
    if(r.ok){msg.innerText='✅ Livro salvo!'; setTimeout(()=>{document.getElementById('addModal').style.display='none'; msg.innerText=''; carregar();},1000);}
    else{msg.innerText='Erro: '+(await r.text())}
  }catch(e){msg.innerText='Erro de conexão. Tenta de novo.'}
}
carregar();
</script>
</body>
</html>
