<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca</title>
<style>
body{background:#0f0f19;color:#fff;font-family:Arial;margin:0;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px}
.card{background:#1e1e2f;border-radius:12px;overflow:hidden;position:relative;cursor:pointer}
.card img{width:100%;height:220px;object-fit:cover}
.card div{padding:10px}
.del{position:absolute;top:5px;right:5px;background:red;border:none;border-radius:50%;width:30px;height:30px;color:#fff;cursor:pointer;z-index:2}
.btn{background:#6c5ce7;color:#fff;border:none;padding:12px 20px;border-radius:8px;cursor:pointer;margin:5px}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);justify-content:center;align-items:center;z-index:10}
.modal-content{background:#1e1e2f;padding:20px;border-radius:12px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto}
input,textarea{width:100%;padding:10px;margin:8px 0;border-radius:6px;border:none;box-sizing:border-box}
#mConteudo{white-space:pre-wrap;word-wrap:break-word;font-size:15px;line-height:1.7;background:#0f0f19;padding:15px;border-radius:8px}
#adminBar{text-align:center;margin-bottom:15px}
</style>
</head>
<body>
<h1 style="text-align:center">📚 Biblioteca Online - 100% pelo celular</h1>

<div id="adminBar">
  <span id="statusADM"></span><br>
  <button class="btn" style="background:#444" onclick="loginADM()">🔒 Login ADM</button>
  <button class="btn" style="background:#222" onclick="logoutADM()">Sair</button>
</div>

<div style="text-align:center;margin:20px"><button id="btnAdd" class="btn" onclick="document.getElementById('addModal').style.display='flex'">+ Adicionar Livro</button> <button class="btn" style="background:#2d2d44" onclick="carregar()">🔄 Atualizar</button></div>
<div id="grid" class="grid"></div>

<div id="addModal" class="modal"><div class="modal-content"><h2>+ Novo Livro</h2>
<input id="nTitulo" placeholder="Título"><input id="nAutor" placeholder="Autor"><input id="nCapa" placeholder="Link da capa (opcional)"><textarea id="nDesc" placeholder="Descrição"></textarea><textarea id="nConteudo" placeholder="Conteúdo do livro"></textarea>
<button class="btn" onclick="salvar()">Salvar</button> <button class="btn" style="background:#444" onclick="document.getElementById('addModal').style.display='none'">Fechar</button></div></div>

<div id="modal" class="modal" onclick="this.style.display='none'"><div class="modal-content" onclick="event.stopPropagation()"><h2 id="mTitulo"></h2><p id="mAutor"></p><p id="mDesc"></p><div id="mConteudo"></div></div></div>

<script>
const API='https://livro-api-9t7z.onrender.com/livros';
const SENHA_ADM='guaxinin123'; // <--- SUA SENHA AQUI, troca se quiser

function ehADM(){ return localStorage.getItem('ehADM')==='true'; }
function atualizarBarra(){
  document.getElementById('statusADM').innerText = ehADM() ? '✅ Você é ADM - pode adicionar/apagar' : '👁️ Visitante - só pode ver';
  document.getElementById('btnAdd').style.display = ehADM() ? 'inline-block' : 'none';
}
function loginADM(){
  let s = prompt('Digite a senha de ADM:');
  if(s===SENHA_ADM){ localStorage.setItem('ehADM','true'); alert('Logado como ADM!'); atualizarBarra(); carregar(); }
  else if(s!==null) alert('Senha errada!');
}
function logoutADM(){ localStorage.removeItem('ehADM'); alert('Saiu do modo ADM'); atualizarBarra(); carregar(); }

async function carregar(){
  let r=await fetch(API); let livros=await r.json(); let g=document.getElementById('grid'); g.innerHTML='';
  livros.forEach(l=>{
    let c=document.createElement('div'); c.className='card';
    let capa = l.capaUrl || 'https://via.placeholder.com/300x400/6c5ce7/ffffff?text='+encodeURIComponent(l.titulo);
    // Só mostra X se for ADM
    let botaoDel = ehADM() ? `<button class="del" onclick="deletar(${l.id},event)">X</button>` : '';
    c.innerHTML= `${botaoDel}<img src="${capa}" onerror="this.src='https://via.placeholder.com/300x400/6c5ce7/ffffff?text=Sem+Capa'"><div><b>${l.titulo}</b><br><small>${l.autor||''}</small></div>`;
    c.onclick=()=>{mTitulo.innerText=l.titulo; mAutor.innerText=l.autor||''; mDesc.innerText=l.descricao||''; mConteudo.innerText=l.conteudo||''; document.getElementById('modal').style.display='flex'};
    g.appendChild(c);
  });
  atualizarBarra();
}
async function deletar(id,e){ 
  e.stopPropagation(); 
  if(!ehADM()) return alert('Só ADM pode apagar! Faça login.');
  if(!confirm('Apagar esse livro?')) return; 
  await fetch(API+'/'+id,{method:'DELETE'}); 
  carregar(); 
}
async function salvar(){
  if(!ehADM()) return alert('Só ADM pode adicionar!');
  let livro={titulo:nTitulo.value, autor:nAutor.value, capaUrl:nCapa.value, descricao:nDesc.value, conteudo:nConteudo.value};
  if(!livro.titulo) return alert('Título obrigatório');
  await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(livro)});
  document.getElementById('addModal').style.display='none'; nTitulo.value=nAutor.value=nCapa.value=nDesc.value=nConteudo.value=''; carregar();
}
carregar();
</script>
</body>
</html>
